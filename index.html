<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport optimizado para móviles sin zoom indeseado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Te Amo en Varios Idiomas</title>
    <!-- Tailwind CSS CDN para diseño de UI responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevenir scroll, rebotes táctiles y seleccionar textos no deseados */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Desactiva gestos de scroll del navegador en móviles */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Estilo para los botones flotantes de control */
        .btn-control {
            background: rgba(26, 9, 43, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #e9d5ff;
            transition: all 0.2s ease;
        }
        .btn-control:active {
            transform: scale(0.92);
            background: rgba(126, 34, 206, 0.8);
        }

        /* Animación suave para la indicación táctil */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }
        .pulse-text {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-black text-white relative">

    <!-- Canvas para el renderizado del corazón y partículas -->
    <canvas id="heartCanvas"></canvas>

    <!-- UI Superior: Botones de Control para Móvil -->
    <div class="absolute top-4 left-0 right-0 z-10 flex justify-between items-center px-4 pointer-events-auto">
        <button id="btnReset" class="btn-control px-3.5 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 shadow-lg shadow-purple-950/40">
            <svg class="w-3.5 h-3.5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span>Formar Corazón</span>
        </button>

        <button id="btnPause" class="btn-control px-3.5 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 shadow-lg shadow-purple-950/40">
            <span id="pauseIcon">
                <svg class="w-3.5 h-3.5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </span>
            <span id="pauseText">Pausar</span>
        </button>
    </div>

    <!-- UI Inferior: Indicador táctil -->
    <div class="absolute bottom-5 left-0 right-0 z-10 text-center pointer-events-none px-4">
        <p class="pulse-text text-purple-300 text-xs tracking-wider uppercase font-light drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]">
            ✨ Toca la pantalla para crear destellos y amor ✨
        </p>
    </div>

    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            // Expresiones de "Te amo" en diversos idiomas
            const phrases = [
                { text: "Te amo", lang: "Español" },
                { text: "I love you", lang: "Inglés" },
                { text: "Je t'aime", lang: "Francés" },
                { text: "Ti amo", lang: "Italiano" },
                { text: "Ich liebe dich", lang: "Alemán" },
                { text: "Eu te amo", lang: "Portugués" },
                { text: "愛してる", lang: "Japonés" },
                { text: "사랑해", lang: "Coreano" },
                { text: "我爱你", lang: "Chino" },
                { text: "Я тебя люблю", lang: "Ruso" },
                { text: "أحبك", lang: "Árabe" },
                { text: "Σ' αγαπώ", lang: "Griego" },
                { text: "Ik hou van jou", lang: "Neerlandés" },
                { text: "Seni seviyorum", lang: "Turco" },
                { text: "मैं तुमसे प्यार करता हूँ", lang: "Hindi" },
                { text: "Kocham Cię", lang: "Polaco" },
                { text: "Te iubesc", lang: "Rumano" },
                { text: "Szeretlek", lang: "Húngaro" },
                { text: "Minä rakastan sinua", lang: "Finlandés" },
                { text: "Volim te", lang: "Croata" },
                { text: "T'estimo", lang: "Catalán" },
                { text: "Mahal kita", lang: "Tagalo" },
                { text: "Aku cinta kamu", lang: "Indonesio" },
                { text: "Tôi yêu bạn", lang: "Vietnamita" },
                { text: "ฉันรักคุณ", lang: "Tailandés" },
                { text: "Miluji tě", lang: "Checo" },
                { text: "Aloha Au Ia 'Oe", lang: "Hawaiano" }
            ];

            // Paleta de tonos morados neón y violetas vibrantes para fondo negro
            const colors = [
                "#f5d0fe", // Lila muy claro
                "#e879f9", // Magenta brillante
                "#c084fc", // Violeta neón
                "#a855f7", // Púrpura medio
                "#d8b4fe", // Lavanda
                "#f0abfc", // Rosa violeta
                "#9333ea"  // Morado intenso
            ];

            let width, height;
            let particles = [];
            let touchHearts = [];
            let isPaused = false;
            let dpr = window.devicePixelRatio || 1;

            // Configurar el tamaño del canvas ajustado para alta definición en móviles (Retina / OLED)
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resize);
            resize();

            // Ecuación matemática del corazón
            function getHeartPoint(t) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return { x, y };
            }

            // Clase de las frases flotantes
            class WordParticle {
                constructor(index, total) {
                    this.index = index;
                    this.total = total;
                    this.init(true);
                }

                init(randomStart = false) {
                    // Ángulo en el contorno del corazón (0 a 2*PI)
                    this.t = (this.index / this.total) * Math.PI * 2 + (Math.random() * 0.1);
                    
                    // Selección de datos
                    const item = phrases[this.index % phrases.length];
                    this.text = item.text;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Tamaño adaptado para móvil
                    const isSmallScreen = width < 480;
                    this.fontSize = isSmallScreen ? (Math.floor(Math.random() * 4) + 11) : (Math.floor(Math.random() * 6) + 14);

                    // Posición de inicio: aleatoria si recién arranca o reinicia
                    if (randomStart) {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                    }

                    // Desplazamiento aleatorio para darle grosor al corazón
                    this.offsetX = (Math.random() - 0.5) * (isSmallScreen ? 18 : 28);
                    this.offsetY = (Math.random() - 0.5) * (isSmallScreen ? 18 : 28);

                    this.speed = 0.03 + Math.random() * 0.03; // Velocidad de acomodo
                    this.alpha = 0.3 + Math.random() * 0.7;
                    this.pulseSpeed = 0.02 + Math.random() * 0.03;
                    this.pulseAngle = Math.random() * Math.PI * 2;
                }

                update(time, scaleFactor) {
                    if (isPaused) return;

                    // Pulso o latido suave
                    const beat = 1 + Math.sin(time * 0.003) * 0.06;
                    const heartScale = scaleFactor * beat;

                    // Calcular punto ideal en la forma del corazón
                    const point = getHeartPoint(this.t);
                    const targetX = (width / 2) + (point.x * heartScale) + this.offsetX;
                    const targetY = (height / 2) + (point.y * heartScale) + this.offsetY;

                    // Mover suavemente hacia la posición del corazón (Lerp)
                    this.x += (targetX - this.x) * this.speed;
                    this.y += (targetY - this.y) * this.speed;

                    // Parpadeo de opacidad
                    this.pulseAngle += this.pulseSpeed;
                    this.currentAlpha = Math.max(0.3, Math.min(1, this.alpha + Math.sin(this.pulseAngle) * 0.3));
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    
                    // Resplandor para que se vea súper estético en pantalla negra
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;

                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.currentAlpha;
                    ctx.font = `600 ${this.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.fillText(this.text, 0, 0);
                    ctx.restore();
                }
            }

            // Clase para minicorazones y destellos al tocar la pantalla
            class TouchHeart {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 12 + 10;
                    this.vx = (Math.random() - 0.5) * 3;
                    this.vy = -Math.random() * 3 - 1.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.life = 1.0;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.rotation = (Math.random() - 0.5) * 0.5;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                }

                draw() {
                    if (this.life <= 0) return;
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    
                    // Dibujar pequeño corazón en SVG path
                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Inicializar las partículas (ajustado en número para excelente rendimiento en teléfonos)
            const particleCount = width < 480 ? 110 : 160;
            function createParticles(randomize = true) {
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new WordParticle(i, particleCount));
                    if (!randomize) {
                        // Colocar inmediatamente en su objetivo
                        const scale = Math.min(width, height) / (width < 480 ? 40 : 36);
                        const point = getHeartPoint(particles[i].t);
                        particles[i].x = (width / 2) + (point.x * scale);
                        particles[i].y = (height / 2) + (point.y * scale);
                    }
                }
            }
            createParticles(true);

            // Manejo de Interacción Táctil (Touch) y Ratón
            function spawnTouchEffects(e) {
                let points = [];
                if (e.touches && e.touches.length > 0) {
                    for (let i = 0; i < e.touches.length; i++) {
                        points.push({ x: e.touches[i].clientX, y: e.touches[i].clientY });
                    }
                } else if (e.clientX) {
                    points.push({ x: e.clientX, y: e.clientY });
                }

                points.forEach(pt => {
                    for (let k = 0; k < 3; k++) {
                        touchHearts.push(new TouchHeart(pt.x, pt.y));
                    }
                });
            }

            // Listeners para pantallas táctiles y escritorio
            window.addEventListener('touchstart', (e) => {
                // Si el toque es fuera de la barra de botones superior
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                    spawnTouchEffects(e);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                    if (Math.random() < 0.6) spawnTouchEffects(e);
                }
            }, { passive: true });

            window.addEventListener('mousedown', (e) => {
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                    spawnTouchEffects(e);
                }
            });

            // Botón Reiniciar animación
            document.getElementById('btnReset').addEventListener('click', (e) => {
                e.stopPropagation();
                createParticles(true);
            });

            // Botón Pausar / Reanudar
            const btnPause = document.getElementById('btnPause');
            const pauseText = document.getElementById('pauseText');
            const pauseIcon = document.getElementById('pauseIcon');

            btnPause.addEventListener('click', (e) => {
                e.stopPropagation();
                isPaused = !isPaused;
                if (isPaused) {
                    pauseText.textContent = "Reanudar";
                    pauseIcon.innerHTML = `
                        <svg class="w-3.5 h-3.5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    `;
                } else {
                    pauseText.textContent = "Pausar";
                    pauseIcon.innerHTML = `
                        <svg class="w-3.5 h-3.5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    `;
                }
            });

            // Bucle principal de animación optimizado
            function animate(time) {
                // Fondo negro con leve estela transparente
                ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
                ctx.fillRect(0, 0, width, height);

                // Cálculo de escala del corazón según tamaño de pantalla
                const scaleFactor = Math.min(width, height) / (width < 480 ? 38 : 34);

                // Dibujar palabras del corazón
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(time, scaleFactor);
                    particles[i].draw();
                }

                // Dibujar y actualizar minicorazones de la interacción táctil
                for (let i = touchHearts.length - 1; i >= 0; i--) {
                    touchHearts[i].update();
                    touchHearts[i].draw();
                    if (touchHearts[i].life <= 0) {
                        touchHearts.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            // Iniciar ciclo de renderizado
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
